version: 1.0.{build}
image:
  - Visual Studio 2019
  - Ubuntu1804
install:
  - choco install gitversion.portable -y
assembly_info:
  patch: false
before_build:
  - nuget restore ZigBeeNet.sln
  - ps: gitversion /l console /output buildserver /updateAssemblyInfo
build:
  publish_nuget: true
  verbosity: minimal
  project: ZigBeeNet.sln
after_build:
  - cmd: ECHO nuget pack <Project>\<NuSpec>.nuspec -version "%GitVersion_NuGetVersion%" -prop "target=%CONFIGURATION%"
  - cmd: nuget pack <Project>\<NuSpec>.nuspec -version "%GitVersion_NuGetVersion%" -prop "target=%CONFIGURATION%"
  - cmd: appveyor PushArtifact "<NuSpec>.%GitVersion_NuGetVersion%.nupkg"
deploy:
  - provider: NuGet
    api_key:
      secure: itVeOMKqDgUEiVaSkfpSZFe3fymDY2D5evHEYUxf5rCcSw5jRy6yHEDJD5RrtwJZ
    skip_symbols: false
    artifact: /.*\.nupkg/

test:
  # only assemblies to test
  assemblies:
    - '**\*.test.dll'
